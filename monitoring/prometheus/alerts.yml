groups:
  - name: everything-opencode-alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5..", job="everything-opencode"}[5m]))
          /
          sum(rate(http_requests_total{job="everything-opencode"}[5m]))
          * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: everything-opencode
        annotations:
          summary: 'High error rate detected'
          description: 'Error rate is {{ $value }}% for Everything OpenCode'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#high-error-rate'

      # High latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="everything-opencode"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          service: everything-opencode
        annotations:
          summary: 'High latency detected'
          description: '95th percentile latency is {{ $value }}s for Everything OpenCode'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#high-latency'

      # Pod down
      - alert: PodDown
        expr: |
          kube_pod_status_phase{phase=~"Pending|Unknown"} > 0
        for: 5m
        labels:
          severity: critical
          service: everything-opencode
        annotations:
          summary: 'Pod is down'
          description: 'Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is {{ $labels.phase }}'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#pod-down'

      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{container!="POD", pod=~"everything-opencode.*"}[5m])) by (pod, namespace)
          /
          sum(kube_pod_container_resource_limits{resource="cpu", pod=~"everything-opencode.*"}) by (pod, namespace)
          * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: everything-opencode
        annotations:
          summary: 'High CPU usage'
          description: 'CPU usage for pod {{ $labels.pod }} is {{ $value }}%'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#high-cpu-usage'

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          sum(container_memory_working_set_bytes{container!="POD", pod=~"everything-opencode.*"}) by (pod, namespace)
          /
          sum(kube_pod_container_resource_limits{resource="memory", pod=~"everything-opencode.*"}) by (pod, namespace)
          * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: everything-opencode
        annotations:
          summary: 'High memory usage'
          description: 'Memory usage for pod {{ $labels.pod }} is {{ $value }}%'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#high-memory-usage'

      # Disk space running out
      - alert: DiskSpaceRunningOut
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"} < 20
        for: 5m
        labels:
          severity: warning
          service: everything-opencode
        annotations:
          summary: 'Disk space running out'
          description: 'Only {{ $value }}% disk space left on {{ $labels.instance }}'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#disk-space-running-out'

      # Deployment not ready
      - alert: DeploymentNotReady
        expr: |
          kube_deployment_status_replicas_available{deployment=~"everything-opencode.*"} < kube_deployment_spec_replicas{deployment=~"everything-opencode.*"}
        for: 5m
        labels:
          severity: critical
          service: everything-opencode
        annotations:
          summary: 'Deployment not ready'
          description: 'Deployment {{ $labels.deployment }} has only {{ $value }} available replicas'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#deployment-not-ready'

      # High request rate
      - alert: HighRequestRate
        expr: |
          sum(rate(http_requests_total{job="everything-opencode"}[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          service: everything-opencode
        annotations:
          summary: 'High request rate'
          description: 'Request rate is {{ $value }} requests per second'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#high-request-rate'

      # Database connection errors
      - alert: DatabaseConnectionErrors
        expr: |
          increase(database_connection_errors_total{job="everything-opencode"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
          service: everything-opencode
        annotations:
          summary: 'Database connection errors'
          description: '{{ $value }} database connection errors in the last 5 minutes'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#database-connection-errors'

      # Cache miss rate high
      - alert: HighCacheMissRate
        expr: |
          rate(cache_misses_total{job="everything-opencode"}[5m])
          /
          (rate(cache_hits_total{job="everything-opencode"}[5m]) + rate(cache_misses_total{job="everything-opencode"}[5m]))
          * 100 > 20
        for: 10m
        labels:
          severity: warning
          service: everything-opencode
        annotations:
          summary: 'High cache miss rate'
          description: 'Cache miss rate is {{ $value }}%'
          runbook_url: 'https://github.com/your-org/everything-opencode/wiki/Runbook#high-cache-miss-rate'
