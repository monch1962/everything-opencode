apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: everything-opencode-staging

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - config-patch.yaml

commonLabels:
  environment: staging

images:
  - name: everything-opencode
    newName: everything-opencode-staging
    newTag: latest

configMapGenerator:
  - name: everything-opencode-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - DEBUG_ENABLED=true
