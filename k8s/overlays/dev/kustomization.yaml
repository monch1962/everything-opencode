apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: everything-opencode-dev

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - config-patch.yaml

commonLabels:
  environment: dev

images:
  - name: everything-opencode
    newName: everything-opencode-dev
    newTag: latest

configMapGenerator:
  - name: everything-opencode-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DEBUG_ENABLED=true
      - API_RATE_LIMIT=1000
