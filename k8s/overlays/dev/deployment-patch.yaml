apiVersion: apps/v1
kind: Deployment
metadata:
  name: everything-opencode
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: main
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '250m'
          env:
            - name: NODE_ENV
              value: 'development'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinescript-debug
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: debug-server
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-runners
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: javascript-runner
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '250m'
        - name: python-runner
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '250m'
