apiVersion: apps/v1
kind: Deployment
metadata:
  name: everything-opencode
  labels:
    app: everything-opencode
    component: main
spec:
  replicas: 2
  selector:
    matchLabels:
      app: everything-opencode
      component: main
  template:
    metadata:
      labels:
        app: everything-opencode
        component: main
    spec:
      containers:
        - name: main
          image: everything-opencode:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3005
              name: debug
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3000'
            - name: DEBUG_PORT
              value: '3005'
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: everything-opencode
  labels:
    app: everything-opencode
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
    - port: 3005
      targetPort: debug
      name: debug
  selector:
    app: everything-opencode
    component: main
